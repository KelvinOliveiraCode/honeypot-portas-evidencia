[project]
name = "honeypot-portas-evidencia"
version = "0.1.0"
description = "Honeypot de portas falsas com gravação de conexões e hash de evidência SHA-256."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kelvin Oliveira" }]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
honeypot-portas-evidencia = "honeypot_portas_evidencia.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "UP", "B", "C4", "D", "PLC", "RET", "RUF", "SIM", "TRY"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D205", "D209", "D210", "D211", "D401", "D402", "D403", "D404", "D406", "D407", "D408", "D409", "D410", "D411", "D412", "D413", "D414", "D415", "D416", "D417", "PLR2004", "PLR0913", "PLR0912", "PLR0911", "PLR0915", "PLW0108", "TRY003"]
